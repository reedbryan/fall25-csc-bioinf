name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          echo "${HOME}/.codon/bin" >> $GITHUB_PATH
      - name: Check out repository code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter pandas numpy matplotlib seaborn
      - name: Install bioinformatics tools
        run: |
          # Install conda/mamba for bioinformatics tools
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3
          source $HOME/miniforge3/etc/profile.d/conda.sh
          conda activate base
          
          # Install bioinformatics tools via conda
          # Note: bgzip and tabix are included in htslib package
          conda install -c bioconda -y samtools bcftools minimap2 hapcut2 htslib wget
          
          # Add conda bin to PATH
          echo "$HOME/miniforge3/bin" >> $GITHUB_PATH
          echo "CONDA_PREFIX=$HOME/miniforge3" >> $GITHUB_ENV
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Week 5
        run: |
          source $HOME/miniforge3/etc/profile.d/conda.sh
          conda activate base
          cd "week5"
          jupyter execute week5.ipynb --inplace
          jupyter nbconvert week5.ipynb --to html --output week5_executed.html
          jupyter nbconvert week5.ipynb --to markdown --output week5_output.md
      - name: Display key results in logs
        if: always()
        run: |
          cd week5
          echo "=== Pipeline Summary ==="
          if [ -f results/summary.txt ]; then
            cat results/summary.txt
          else
            echo "⚠ Summary file not found"
          fi
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week5-results
          path: |
            week5/week5.ipynb
            week5/week5_executed.html
            week5/week5_output.md
            week5/results/
            week5/variants/*.vcf
          retention-days: 30
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('week5/results/summary.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Week 5 Pipeline Results\n```\n' + summary + '\n```'
            });